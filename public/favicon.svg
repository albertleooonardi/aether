<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- rounded sky tile -->
  <rect width="64" height="64" rx="16" fill="url(#sky)"/>

  <!-- sun peeking above the cloud -->
  <g stroke="#fde68a" stroke-width="2.6" stroke-linecap="round">
    <line x1="40" y1="10" x2="40" y2="6"/>
    <line x1="49.5" y1="12.5" x2="52.3" y2="9.7"/>
    <line x1="53" y1="22" x2="57" y2="22"/>
    <line x1="49.5" y1="31.5" x2="52.3" y2="34.3"/>
  </g>
  <circle cx="40" cy="22" r="8" fill="#fde68a"/>

  <!-- cloud -->
  <g fill="#ffffff">
    <circle cx="25" cy="42" r="9"/>
    <circle cx="37" cy="39" r="12"/>
    <circle cx="47" cy="43" r="8"/>
    <rect x="19" y="42" width="30" height="10" rx="5"/>
  </g>
</svg>
